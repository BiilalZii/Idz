name: Build Debug APK 
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Prepare project (direct source OR uploaded ZIP)
        run: |
          if [ ! -f "app/build.gradle.kts" ]; then
            ZIP_FILE=$(ls *.zip | head -1)
            if [ -z "$ZIP_FILE" ]; then echo "No source and no ZIP found!"; exit 1; fi
            echo "Unzipping $ZIP_FILE ..."
            unzip -q "$ZIP_FILE"
            if [ -d "algerian-identity-wallet" ]; then
              cp -r algerian-identity-wallet/. .
              rm -rf algerian-identity-wallet "$ZIP_FILE"
            fi
          fi
          echo "Applying compatibility patches (only if needed)..."
          python3 - <<'PYEOF'
          import pathlib
          def patch(path, old, new):
              p = pathlib.Path(path)
              t = p.read_text(encoding="utf-8")
              if old in t:
                  p.write_text(t.replace(old, new, 1), encoding="utf-8")
                  print(f"patched: {path}")
              else:
                  print(f"already ok: {path}")
          patch("app/build.gradle.kts",
                "net.sf.scuba:scuba-smartcards-j2se:0.0.20",
                "net.sf.scuba:scuba-sc-android:0.0.20")
          patch("app/build.gradle.kts",
                'implementation("net.zetetic:android-database-sqlcipher:4.5.4")',
                'implementation("net.zetetic:android-database-sqlcipher:4.5.4")\n    implementation("androidx.sqlite:sqlite:2.4.0")')
          patch("app/build.gradle.kts",
                'versionName = "1.0"\n    }',
                'versionName = "1.0"\n\n        ndk {\n            abiFilters += listOf("armeabi-v7a", "arm64-v8a")\n        }\n    }')
          patch("app/src/main/AndroidManifest.xml",
                '\n        android:icon="@mipmap/ic_launcher"',
                '')
          patch("app/src/main/java/com/wallet/identity/biometrics/LiveFaceMatcher.kt",
                "    private fun imageProxyToBitmap(",
                "    @OptIn(ExperimentalGetImage::class)\n    private fun imageProxyToBitmap(")
          PYEOF
          test -f app/build.gradle.kts && echo "Project ready ✓"
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install required SDK packages
        run: |
          yes 2>/dev/null | sdkmanager "platforms;android-34" "build-tools;34.0.0" > /dev/null || true
      - name: Set up Gradle 8.7
        run: |
          curl -sL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.7/bin" >> $GITHUB_PATH
      - name: Build debug APK
        run: gradle assembleDebug --console=plain
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AlgerianIdentityWallet-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
